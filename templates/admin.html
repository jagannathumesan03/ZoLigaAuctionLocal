<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Football Auction</title>
<link rel="stylesheet" href="/static/css/style.css?v=broadcast-1">
<script src="/static/js/theme.js?v=theme-1"></script>
</head>
<body class="admin-page">

<header class="topbar">
  <div class="brand"><span class="dot" aria-hidden="true"></span><span>Auction Control</span><span class="brand-context">Live operations</span></div>
  <div class="topbar-actions">
    <span class="muted" id="whoami"></span>
    <button class="btn btn-sm btn-quiet theme-toggle" id="themeToggle" type="button">Light theme</button>
    <button class="btn btn-sm btn-quiet" type="button" onclick="logout()">Logout</button>
  </div>
</header>

<main class="container admin-shell">

  <nav class="tabs" aria-label="Admin sections">
    <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="auction">Live auction</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="players">Player pool</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="teams">Teams</button>
  </nav>

  <!-- ===================== AUCTION TAB ===================== -->
  <section class="tab-content active" id="tab-auction" role="tabpanel">
    <div class="section-heading">
      <div><p class="eyebrow">Live desk</p><h1>Run the auction</h1></div>
      <span class="connection-state"><span></span> Live updates connected</span>
    </div>
    <div class="panel auction-stage">
      <div id="spotlight"></div>
    </div>

    <div class="panel bid-workspace" id="bidPanelWrapper" style="display:none;">
      <div class="panel-heading"><div><p class="eyebrow">Bidding desk</p><h2>Record the next bid</h2></div></div>
      <div id="bidPanel"></div>
    </div>

    <div class="panel">
      <div class="panel-heading list-heading">
        <div><p class="eyebrow">Player queue</p><h2>Select the next player</h2></div>
        <input class="search-input" type="search" id="auctionSearch" placeholder="Search name or role" aria-label="Search auction player queue">
      </div>
      <div id="auctionPlayerList" class="grid grid-players mt-16"></div>
    </div>
  </section>

  <!-- ===================== PLAYERS TAB ===================== -->
  <section class="tab-content" id="tab-players" role="tabpanel">
    <div class="panel">
      <div class="panel-heading list-heading">
        <div><p class="eyebrow">Roster management</p><h1>Player pool</h1></div>
        <div class="toolbar-actions">
          <button class="btn btn-primary btn-sm" type="button" onclick="openPlayerModal()">Add player</button>
          <label class="btn btn-sm upload-button">
            Bulk CSV Upload
            <input type="file" accept=".csv" id="csvInput" style="display:none" onchange="uploadCsv(event)">
          </label>
        </div>
      </div>
      <div class="filter-row mt-16">
        <input type="search" id="playerSearch" placeholder="Search by name or role" aria-label="Search players">
        <select id="playerStatusFilter" aria-label="Filter players by status">
          <option value="">All statuses</option>
          <option value="waiting">Waiting</option>
          <option value="auction">Up for auction</option>
          <option value="sold">Sold</option>
          <option value="unsold">Unsold</option>
        </select>
      </div>
      <div id="playersList" class="grid grid-players mt-16"></div>
    </div>
  </section>

  <!-- ===================== TEAMS TAB ===================== -->
  <section class="tab-content" id="tab-teams" role="tabpanel">
    <div class="panel">
      <div class="panel-heading list-heading">
        <div><p class="eyebrow">Auction roster</p><h1>Teams and squads</h1></div>
        <button class="btn btn-primary btn-sm" type="button" onclick="openTeamModal()">Add team</button>
      </div>
      <div id="teamsList" class="grid grid-teams mt-16"></div>
    </div>
  </section>

</main>

<!-- ===================== MODALS ===================== -->
<div class="modal-overlay" id="playerModalOverlay" style="display:none;">
  <div class="modal">
    <h3 id="playerModalTitle">Add Player</h3>
    <form id="playerForm">
      <input type="hidden" id="playerId">
      <div class="field"><label>Name</label><input type="text" id="playerName" required></div>
      <div class="row">
        <div class="field"><label>Role</label>
          <select id="playerRole">
            <option>Forward</option>
            <option>Midfielder</option>
            <option>Defender</option>
            <option>Goalkeeper</option>
          </select>
        </div>
        <div class="field"><label>Base Price</label><input type="number" id="playerBasePrice" min="0" value="0" required></div>
      </div>
      <div class="field"><label>Stats / Bio</label><textarea id="playerStats" rows="3"></textarea></div>
      <div class="field">
        <label>FIFA-style card ratings (0-99)</label>
        <div class="card-stat-inputs">
          <div class="field"><label>PAC</label><input type="number" id="playerPace" min="0" max="99" value="50"></div>
          <div class="field"><label>SHO</label><input type="number" id="playerShooting" min="0" max="99" value="50"></div>
          <div class="field"><label>PAS</label><input type="number" id="playerPassing" min="0" max="99" value="50"></div>
          <div class="field"><label>DRI</label><input type="number" id="playerDribbling" min="0" max="99" value="50"></div>
          <div class="field"><label>DEF</label><input type="number" id="playerDefending" min="0" max="99" value="50"></div>
          <div class="field"><label>PHY</label><input type="number" id="playerPhysical" min="0" max="99" value="50"></div>
        </div>
      </div>
      <div class="field"><label>Photo</label><input type="file" id="playerPhoto" accept="image/*"></div>
      <div class="row mt-16">
        <button type="button" class="btn" onclick="closePlayerModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="teamModalOverlay" style="display:none;">
  <div class="modal">
    <h3 id="teamModalTitle">Add Team</h3>
    <form id="teamForm">
      <input type="hidden" id="teamId">
      <div class="field"><label>Team Name</label><input type="text" id="teamName" required></div>
      <div class="row">
        <div class="field"><label>Purse Total</label><input type="number" id="teamPurse" min="0" required></div>
        <div class="field"><label>Max Slots</label><input type="number" id="teamSlots" min="1" value="7" required></div>
      </div>
      <div class="field"><label>Logo</label><input type="file" id="teamLogo" accept="image/*"></div>
      <div class="row mt-16">
        <button type="button" class="btn" onclick="closeTeamModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="assignModalOverlay" style="display:none;">
  <div class="modal">
    <h3>Assign Player to Team</h3>
    <p class="muted" id="assignPlayerName"></p>
    <form id="assignForm">
      <input type="hidden" id="assignPlayerId">
      <div class="field">
        <label>Winning Team</label>
        <select id="assignTeamId" required></select>
      </div>
      <div class="field">
        <label>Sold Price</label>
        <input type="number" id="assignSoldPrice" min="0" required>
      </div>
      <div class="row mt-16">
        <button type="button" class="btn" onclick="closeAssignModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Confirm Sale</button>
      </div>
    </form>
  </div>
</div>

<script src="/static/js/confetti.js?v=1"></script>
<script src="/static/js/admin.js?v=broadcast-1"></script>
</body>
</html>
