<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Auction — Football Tournament</title>
<link rel="stylesheet" href="/static/css/style.css?v=affiliation-4">
<script src="/static/js/theme.js?v=theme-3"></script>
</head>
<body class="viewer-page">

<header class="topbar">
  <div class="brand"><span class="dot" aria-hidden="true"></span><span id="viewerBrand">Live Auction</span></div>
  <div class="ticker-wrap" id="tickerWrap">
    <span class="ticker-live-badge"><span aria-hidden="true"></span> Live</span>
    <div class="ticker-primary" id="tickerPrimary" aria-live="polite">Waiting for the next player…</div>
    <div class="ticker-viewport" id="tickerViewport">
      <div class="ticker-track" id="tickerTrack">
        <span class="ticker-content" id="tickerContent"></span>
      </div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-sm btn-quiet icon-btn" id="fullscreenToggle" type="button" aria-label="Full screen" title="Full screen">
      <svg class="icon-main" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      <svg class="icon-alt" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
    </button>
    <button class="btn btn-sm btn-quiet icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme" title="Switch theme">
      <svg class="icon-main" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-alt" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
    </button>
    <button class="btn btn-sm btn-quiet icon-btn" type="button" onclick="logout()" aria-label="Logout" title="Logout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>
</header>

<div id="auctionTimerDock" class="auction-timer-dock" aria-live="polite"></div>

<main class="container viewer-shell">

  <section class="auction-broadcast" aria-labelledby="liveAuctionTitle">
    <h1 class="sr-only" id="liveAuctionTitle">Live auction dashboard</h1>
    <div class="viewer-window">
      <div id="spotlight"></div>
      <div class="spotlight-camera" id="spotlightCamera">
        <video id="spotlightCameraVideo" autoplay muted playsinline></video>
        <button class="spotlight-camera-start" id="spotlightCameraStart" type="button">Start camera</button>
      </div>
    </div>
  </section>

  <section class="auction-status-strip" id="auctionOverview" aria-label="Auction status"></section>

  <nav class="tabs" aria-label="Auction data views">
    <button class="tab manager-tab" type="button" role="tab" aria-selected="false" data-tab="manager" hidden>Manager desk</button>
    <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="teams">Team purses</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="players">Player pool</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="team-view">Team view</button>
  </nav>

  <section class="tab-content" id="tab-manager" role="tabpanel">
    <div id="managerDesk" class="manager-desk"></div>
  </section>

  <section class="tab-content active" id="tab-teams" role="tabpanel">
    <div class="section-heading compact"><div><p class="eyebrow">Live standings</p><h2>Team purses</h2></div><span class="connection-state"><span></span> Live updates connected</span></div>
    <div id="teamsList" class="grid grid-teams"></div>
  </section>

  <section class="tab-content" id="tab-players" role="tabpanel">
    <div class="panel">
      <div class="panel-heading"><div><p class="eyebrow">Player pool</p><h2>Search every player</h2></div></div>
      <div class="filter-row">
        <input type="search" id="playerSearch" placeholder="Search by player name or role" aria-label="Search every player">
        <select id="playerStatusFilter" aria-label="Filter players by status">
          <option value="">All statuses</option>
          <option value="waiting">Waiting</option>
          <option value="auction">Up for auction</option>
          <option value="sold">Sold</option>
          <option value="unsold">Unsold</option>
        </select>
      </div>
    </div>
    <div id="playersList" class="grid grid-players"></div>
  </section>

  <section class="tab-content" id="tab-team-view" role="tabpanel">
    <div class="section-heading compact"><div><p class="eyebrow">Team rosters</p><h2>Squads and remaining purse</h2></div></div>
    <div id="teamViewList" class="grid team-view-grid"></div>
  </section>

</main>

<script src="/static/js/confetti.js?v=rules-5"></script>
<script src="/static/js/pack-reveal.js?v=rules-1"></script>
<script src="/static/js/player-affiliation.js?v=affiliation-2"></script>
<script src="/static/js/viewer.js?v=affiliation-3"></script>
</body>
</html>
