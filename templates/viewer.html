<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Auction — Football Tournament</title>
<link rel="stylesheet" href="/static/css/style.css?v=no-nextup-1">
<script src="/static/js/theme.js?v=theme-1"></script>
</head>
<body class="viewer-page">

<header class="topbar">
  <div class="brand"><span class="dot" aria-hidden="true"></span><span>Live Auction</span></div>
  <div class="ticker-wrap" id="tickerWrap">
    <span class="ticker-live-badge"><span aria-hidden="true"></span> Live</span>
    <div class="ticker-primary" id="tickerPrimary" aria-live="polite">Waiting for the next player…</div>
    <div class="ticker-viewport" id="tickerViewport">
      <div class="ticker-track" id="tickerTrack">
        <span class="ticker-content" id="tickerContent"></span>
      </div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-sm btn-quiet theme-toggle" id="themeToggle" type="button">Light theme</button>
    <button class="btn btn-sm btn-quiet" type="button" onclick="logout()">Logout</button>
  </div>
</header>

<div id="auctionTimerDock" class="auction-timer-dock" aria-live="polite"></div>

<main class="container viewer-shell">

  <section class="auction-broadcast" aria-labelledby="liveAuctionTitle">
    <h1 class="sr-only" id="liveAuctionTitle">Live auction dashboard</h1>
    <div id="spotlight"></div>
  </section>

  <section class="auction-status-strip" id="auctionOverview" aria-label="Auction status"></section>

  <nav class="tabs" aria-label="Auction data views">
    <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="teams">Team purses</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="players">Player pool</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="team-view">Team view</button>
  </nav>

  <section class="tab-content active" id="tab-teams" role="tabpanel">
    <div class="section-heading compact"><div><p class="eyebrow">Live standings</p><h2>Team purses</h2></div><span class="connection-state"><span></span> Live updates connected</span></div>
    <div id="teamsList" class="grid grid-teams"></div>
  </section>

  <section class="tab-content" id="tab-players" role="tabpanel">
    <div class="panel">
      <div class="panel-heading"><div><p class="eyebrow">Player pool</p><h2>Search every player</h2></div></div>
      <div class="filter-row">
        <input type="search" id="playerSearch" placeholder="Search by player name or role" aria-label="Search every player">
        <select id="playerStatusFilter" aria-label="Filter players by status">
          <option value="">All statuses</option>
          <option value="waiting">Waiting</option>
          <option value="auction">Up for auction</option>
          <option value="sold">Sold</option>
          <option value="unsold">Unsold</option>
        </select>
      </div>
    </div>
    <div id="playersList" class="grid grid-players"></div>
  </section>

  <section class="tab-content" id="tab-team-view" role="tabpanel">
    <div class="section-heading compact"><div><p class="eyebrow">Team rosters</p><h2>Squads and remaining purse</h2></div></div>
    <div id="teamViewList" class="grid team-view-grid"></div>
  </section>

</main>

<script src="/static/js/confetti.js?v=timer-1"></script>
<script src="/static/js/pack-reveal.js?v=slot-h-1"></script>
<script src="/static/js/viewer.js?v=no-nextup-1"></script>
</body>
</html>
