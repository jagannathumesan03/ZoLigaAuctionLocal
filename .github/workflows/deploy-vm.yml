name: Deploy to GCP VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/zoliga/football-auction
            git fetch origin
            git checkout main
            git reset --hard origin/main
            # Keep the venv outside the git tree so resets never wipe it
            if [ ! -x /opt/zoliga/venv/bin/uvicorn ]; then
              python3 -m venv /opt/zoliga/venv
            fi
            /opt/zoliga/venv/bin/pip install -r requirements.txt
            sudo systemctl restart zoliga-auction
            sudo systemctl is-active zoliga-auction
